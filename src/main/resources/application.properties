# APPLICATION
spring.application.name=GOATSPORTS-SOCIAL-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# MONGODB
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
management.health.mongodb.enabled=false
# SQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# FEIGN
spring.cloud.openfeign.client.config.socialAiPersonalizationClient.connect-timeout=500
spring.cloud.openfeign.client.config.socialAiPersonalizationClient.read-timeout=2000
# JWT
app.jwt.secret=${JWT_SECRET}
# SERVICES
storage.service.url=${STORAGE_SERVICE_URL}
club.service.url=${CLUB_SERVICE_URL}
ai.service.url=${AI_SERVICE_URL}
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.topic.user-log=${KAFKA_TOPIC_USER_LOG}
social.events.topic=${SOCIAL_EVENTS_TOPIC}
social.events.producer-enabled=${SOCIAL_EVENTS_PRODUCER_ENABLED}
activity.events.enabled=${ACTIVITY_EVENTS_ENABLED}
activity.events.topic=${ACTIVITY_EVENTS_TOPIC}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId:-}] - %msg%n
# SWAGGER
springdoc.api-docs.enabled=false
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=false
# PAGINATION
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.max-page-size=20
# FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.enabled=true
server.tomcat.max-part-count=${MAX_PART_COUNT}
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
# DEMO
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}